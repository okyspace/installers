define:
  pullSecrets: &pullSecrets
    - name: docker-aip-pullsecret
  # controller/agent/router/storage all ship together from the kserve repo,
  # so they share one version. rbacProxyImage is a separate upstream project
  # (quay.io/brancz/kube-rbac-proxy) and is versioned independently below.
  tag: &tag "v0.19.0"

# Replace docker.io and quay.io with your private registry address. 
# The images must be pushed to your private registry before installing KServe.
kserve:
  controller:
    # -- KServe deployment mode: "Standard", "Knative".
    deploymentMode: "Standard"
    gateway:
      # Cluster runs NGINX Ingress not default Istio
      ingressGateway:
        className: nginx
    image: docker.io/kserve/kserve-controller
    tag: *tag
    rbacProxyImage: quay.io/brancz/kube-rbac-proxy:v0.18.0
    imagePullSecrets: *pullSecrets

  agent:
    image: docker.io/kserve/agent
    tag: *tag

  router:
    image: docker.io/kserve/router
    tag: *tag
    imagePullSecrets: *pullSecrets

  storage:
    image: docker.io/kserve/storage-initializer
    tag: *tag
