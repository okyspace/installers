# Minimal CPU-only smoke test for the huggingfaceserver ClusterServingRuntime.
# Verifies the controller + runtime install actually work end-to-end - not a
# real model (sshleifer/tiny-gpt2 has near-random weights, output is gibberish
# by design). This cluster has no GPU nodes, so --backend=huggingface forces
# plain transformers instead of vLLM's default GPU auto-select.
#
# Deploy:  kubectl apply -f hf-smoke-test.yaml
# Test:    kubectl port-forward -n kserve-test svc/hf-smoke-test-predictor 8080:80
#          curl -X POST http://127.0.0.1:8080/openai/v1/completions \
#            -H "Content-Type: application/json" \
#            -d '{"model": "hf-smoke-test", "prompt": "The quick brown fox", "max_tokens": 10}'
#
apiVersion: v1
kind: Namespace
metadata:
  name: kserve-test
---
# Not strictly required for this sample (no cloud storage/IAM credentials
# involved), but kept separate from "default" for clean per-model RBAC
# scoping if you attach roles/pull secrets to it later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hf-smoke-test
  namespace: kserve-test
---
# For gated/private models (e.g. meta-llama/*), fill in the Secret below with
# a real token before applying. huggingface_hub reads HF_TOKEN automatically
# (verified inside the actual image) - no CLI flag needed, just the env var.
# Not needed for the default sshleifer/tiny-gpt2 (public model).
apiVersion: v1
kind: Secret
metadata:
  name: hf-token
  namespace: kserve-test
type: Opaque
stringData:
  HF_TOKEN: <your-token>
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: hf-smoke-test
  namespace: kserve-test
spec:
  predictor:
    serviceAccountName: hf-smoke-test
    # Pins min==max so KServe doesn't create its own default HPA - the
    # ScaledObject below manages scaling instead. Without this, KEDA's
    # admission webhook rejects the ScaledObject with "already managed by
    # the hpa 'hf-smoke-test-predictor'" (verified - this is exactly what
    # happened before adding these two fields).
    minReplicas: 1
    maxReplicas: 1
    # schedulerName: runai-scheduler   # default is "default-scheduler"
    # annotations land on the pod template (not the ISVC object itself) -
    # this is where Run:AI's scheduler/device-plugin annotations go, e.g.
    # gpu-fraction or project/queue tagging. Exact keys depend on your
    # Run:AI setup/version - not guessing them here, fill in from your docs.
    # annotations:
    #   gpu-fraction: "0.5"
    volumes:
      # emptyDir, not a PVC: minikube's default "standard" StorageClass
      # (k8s.io/minikube-hostpath) sets no nodeAffinity on the PVs it
      # creates, so on this 2-node cluster the pod can land on either node
      # while the actual directory only gets created (inconsistently owned,
      # fsGroup not reliably applied) on whichever one first mounts it -
      # verified this caused the CrashLoopBackOff (PermissionError writing
      # to /tmp/huggingface). emptyDir sidesteps this: it's a real
      # kubelet-managed volume that correctly respects the pod's
      # securityContext regardless of node. Trade-off: cache doesn't survive
      # pod restarts/rescheds - fine for a smoke test re-downloading a
      # few-MB model, not fine for a real multi-GB model in production.
      - name: hf-cache
        emptyDir: {}
    model:
      modelFormat:
        name: huggingface
      image: docker.io/kserve/huggingfaceserver:v0.19.0-gpu
      #   ^ overrides the ClusterServingRuntime's own image for just this
      #     ISVC (full repo:tag in one string - no separate tag field here,
      #     unlike override-runtimes.yaml's split image/tag). Leave unset to
      #     use whatever kserve-huggingfaceserver currently points at.
      #   NOTE: -gpu image on a no-GPU cluster - expect this pod to fail
      #     (no CUDA device), separate from whether the override itself works.
      # Other runtimes enabled on this cluster (see override-runtimes.yaml):
      #   kserve-huggingfaceserver-multinode - same image, distributed vLLM across nodes
      #   kserve-tritonserver                - modelFormat: tensorrt, NOT a drop-in swap here;
      #                                         Triton expects a model-repository storageUri,
      #                                         not the --model_id/--backend/--task args below
      runtime: kserve-huggingfaceserver
      args:
        - --model_id=sshleifer/tiny-gpt2
        - --backend=huggingface
        - --task=text_generation
      env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: HF_TOKEN
              optional: true
      volumeMounts:
        - name: hf-cache
          mountPath: /tmp/huggingface
      resources:
        requests:
          cpu: "1"
          memory: 2Gi
          nvidia.com/gpu: "2"
        limits:
          cpu: "2"
          memory: 4Gi
          nvidia.com/gpu: "2"

# Ingress is auto-created by the KServe controller (disableIngressCreation:
# false is the chart default) - no separate Ingress resource needed here.
# Class comes from override-controller.yaml's
# kserve.controller.gateway.ingressGateway.className (set to nginx, matching
# this cluster's actual ingress controller - the chart default of "istio"
# would leave it unclaimed, since nothing here implements that class).
#
# Hostname is computed, not set anywhere in this file - domainTemplate
# "{{ .Name }}-{{ .Namespace }}.{{ .IngressDomain }}" against this ISVC's
# own name/namespace and the cluster-wide ingressDomain (example.com by
# default) produces:
#   hf-smoke-test-kserve-test.example.com            (ISVC-level)
#   hf-smoke-test-predictor-kserve-test.example.com  (predictor-level)
# example.com isn't real DNS, so requests need a matching Host header:
#   curl -H "Host: hf-smoke-test-kserve-test.example.com" http://<nginx-lb-ip>/...
---
# Requires KEDA installed (installers/keda/install.sh) - NOT installed on
# this cluster yet (checked: no scaledobjects.keda.sh CRD, no keda helm
# release). Also requires a Prometheus scraping this predictor's /metrics
# (also not set up here) for the "prometheus" trigger's serverAddress to
# query. Applying this now will fail on both counts, same as the
# ServiceMonitor above.
#
# Targets the actual Deployment RawDeployment mode creates
# (hf-smoke-test-predictor, verified via `kubectl get deployment -n
# kserve-test`) - this is Standard mode's plain Deployment, not a Knative
# Revision, which is exactly why KEDA (not Knative's autoscaler) applies here.
#
# vllm:num_requests_waiting - confirmed by inspecting the actual vLLM version
# bundled in kserve/huggingfaceserver:v0.19.0 (grepped the real metric name
# strings, not guessed). Scales on queue depth: requests piling up faster
# than they're being processed, rather than raw CPU/GPU utilization.
#
# NOTE: this sample's InferenceService runs --backend=huggingface (plain
# transformers, CPU-only - this cluster has no GPU nodes), so it does NOT
# actually emit vllm:* metrics. This trigger is written for when the same
# ISVC is switched to --backend=vllm on a GPU node - it won't fire on real
# data as currently deployed.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: hf-smoke-test
  namespace: kserve-test
spec:
  scaleTargetRef:
    name: hf-smoke-test-predictor
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
        query: vllm:num_requests_waiting{namespace="kserve-test",pod=~"hf-smoke-test-predictor-.*"}
        threshold: "5"
